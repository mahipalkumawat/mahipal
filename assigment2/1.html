<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #f5dada;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background-color: #f5dada;
    border-radius: 20px;
    text-align: center;
    padding: 20px;
    width: 90%;
    max-width: 400px;
}

h1 {
    font-size: 28px;
    color: #000;
    margin-bottom: 10px;
}

.illustration {
    width: 100%;
    max-width: 250px;
    margin-bottom: 20px;
}

form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

input {
    padding: 12px;
    border: 2px solid #000;
    border-radius: 10px;
    font-size: 16px;
}

button {
    padding: 12px;
    background-color: #fff;
    border: 2px solid #000;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background-color: #f0bcbc;
}
    </style>
</head>
<body>
    <div class="container">
        <h1>create <br> <span>Account</span></h1>
        <img src="yoga-woman.png" alt="Yoga Woman" class="illustration">
        <form>
            <input type="text" placeholder="Email or phone number">
            <input type="password" placeholder="Password">
            <button type="submit">Sign Up</button>
        </form>
    </div>
</body>
</html>
