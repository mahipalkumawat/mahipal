<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zen Meditation</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

body {
  background-color: #1a1a1a;
  color: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background-color: #fff;
  border-radius: 20px;
  padding: 30px 20px;
  width: 320px;
  position: relative;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  font-size: 24px;
  color: #555;
}

.image-circle {
  margin: 30px auto 20px;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background-color: #ffe9d6;
  display: flex;
  justify-content: center;
  align-items: center;
}

.image-circle img {
  width: 100px;
  height: auto;
}

.title {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin-top: 20px;
}

.subtitle {
  text-align: center;
  color: #888;
  margin-bottom: 30px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  margin-bottom: 20px;
}

.controls button {
  background-color: #ffe9d6;
  border: none;
  border-radius: 50%;
  padding: 15px;
  font-size: 20px;
  cursor: pointer;
}

.pause {
  font-size: 28px;
}

.progress-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.progress-bar input[type="range"] {
  flex: 1;
  accent-color: #fbe390;
}
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <span class="back">&larr;</span>
      <span class="download">&#8681;</span>
    </div>

    <div class="image-circle">
      <img src="meditation.png" alt="Meditation" />
    </div>

    <h2 class="title">Zen Meditation</h2>
    <p class="subtitle">Inner Peace</p>

    <div class="controls">
      <button class="prev">&#9664;</button>
      <button class="pause">&#10073;&#10073;</button>
      <button class="next">&#9654;</button>
    </div>

    <div class="progress-bar">
      <span>13:35</span>
      <input type="range" min="0" max="100" value="90" />
      <span>15:00</span>
    </div>
  </div>
</body>
</html>
