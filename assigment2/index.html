<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>CalmMind</title>
  <style>

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1c0f0f;
    }
    
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    .card {
      width: 90%;
      max-width: 400px;
      background-color: #f6dedd;
      border-radius: 25px;
      padding: 20px;
      text-align: center;
      position: relative;
    }
    
    .header {
      text-align: left;
    }
    
    .logo {
      color: #aab2bd;
      font-weight: bold;
      font-size: 1rem;
    }
    
    h1 {
      color: #1a1a1a;
      font-size: 2rem;
      margin: 0.5em 0;
    }
    
    .illustration img {
      width: 70%;
      margin: 2em 0;
    }
    
    .button {
      display: flex;
      justify-content: center;
    }
    
    .button button {
      background-color: #1c1c1c;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.5rem;
      color: white;
      cursor: pointer;
    }
    
    </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <p class="logo">CalmMind</p>
        <h1>Stress Less and<br>Laugh Louder</h1>
      </div>
      <div class="illustration">
        <img src="meditation.png" alt="Meditating Person">
      </div>
      <div class="button">
        <button><span>&#8250;</span></button>
      </div>
    </div>
  </div>
</body>
</html>
