<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoga & Meditation</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background-color: #fbeeea;
  color: #333;
}

.container {
  padding: 20px;
  max-width: 500px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.greeting {
  font-size: 24px;
}

.illustration img {
  height: 120px;
}

.intro {
  margin: 20px 0;
}

.intro h2 {
  font-size: 22px;
}

.intro span {
  font-weight: bold;
}

.calories-box {
  background-color: white;
  padding: 15px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.calories-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.dropdown {
  background: none;
  border: 1px solid #aaa;
  padding: 4px 8px;
  border-radius: 8px;
  cursor: pointer;
}

.calories-chart {
  margin-top: 10px;
}

.cal-val {
  font-size: 20px;
  font-weight: bold;
  color: #ff7a00;
}

.courses h3 {
  margin-bottom: 15px;
  font-size: 18px;
}

.course-card {
  background-color: white;
  display: flex;
  align-items: center;
  padding: 10px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

.course-card img {
  height: 60px;
  margin-right: 15px;
}

.course-info h4 {
  margin-bottom: 4px;
}

.course-info p {
  font-size: 14px;
  margin: 2px 0;
}

.author span {
  color: #ffaa00;
}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <p class="greeting">Namaste, <strong>Vani</strong></p>
      <div class="illustration">
        <img src="yoga-illustration.png" alt="Meditation" />
      </div>
    </div>

    <div class="intro">
      <h2>Let’s start basic <span>yoga and meditation</span></h2>
    </div>

    <div class="calories-box">
      <div class="calories-header">
        <p>Calories Statistics</p>
        <button class="dropdown">Daily ▼</button>
      </div>
      <div class="calories-chart">
        <p><span class="cal-val">27,000.87</span> cal</p>
        <img src="chart-placeholder.png" alt="Calories Graph" />
      </div>
    </div>

    <div class="courses">
      <h3>Recommended Courses</h3>
      <div class="course-card">
        <img src="yoga-pilates-icon.png" alt="Yoga Pilates">
        <div class="course-info">
          <h4>Yoga Pilates</h4>
          <p>5 lessons</p>
          <p class="author">By Sarah William • All Level • <span>4.5★</span></p>
        </div>
      </div>

      <div class="course-card">
        <img src="full-body-stretch-icon.png" alt="Full Body Stretch">
        <div class="course-info">
          <h4>Full Body Stretch</h4>
          <p>5 lessons</p>
          <p class="author">By Sarah William • All Level • <span>4.5★</span></p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
